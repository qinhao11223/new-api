name: Deploy production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or full commit SHA to deploy'
        required: true
        default: 'main'
        type: string
      confirm:
        description: 'Type DEPLOY to confirm the production release'
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: nexa-production-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve immutable release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Require explicit confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != 'DEPLOY' ]; then
            echo '::error::Enter DEPLOY exactly to start a production release.'
            exit 1
          fi

      - name: Check out requested ref
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          ref: ${{ inputs.ref }}

      - name: Resolve release identity
        id: release
        run: |
          SHA=$(git rev-parse HEAD)
          SHORT_SHA=$(git rev-parse --short=12 HEAD)
          RELEASE_ID="prod-$(date -u +'%Y%m%d%H%M%S')-${SHORT_SHA}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "Resolved $RELEASE_ID from $SHA"

  validate:
    name: Validate and package frontend
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOWORK: 'off'
    steps:
      - name: Check out immutable commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Write release version
        run: printf '%s\n' '${{ needs.prepare.outputs.release_id }}' > VERSION

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Typecheck frontend
        working-directory: web
        run: bun run typecheck

      - name: Test frontend
        working-directory: web
        run: bun run test

      - name: Build frontend
        working-directory: web
        env:
          DISABLE_ESLINT_PLUGIN: 'true'
          VITE_REACT_APP_VERSION: ${{ needs.prepare.outputs.release_id }}
        run: bun run build

      - name: Package frontend with checksum
        run: |
          tar -C web/dist -czf frontend.tar.gz .
          sha256sum frontend.tar.gz > frontend.tar.gz.sha256

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum

      - name: Test root module
        run: go test ./...

      - name: Build relaykit independently
        working-directory: relaykit
        run: go build ./...

      - name: Test relaykit independently
        working-directory: relaykit
        run: go test ./...

      - name: Upload immutable frontend bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-frontend-${{ needs.prepare.outputs.release_id }}
          path: |
            frontend.tar.gz
            frontend.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  build_image:
    name: Build immutable production image
    needs: [prepare, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image_ref: ${{ steps.image.outputs.image_ref }}
      image_repository: ${{ steps.repository.outputs.image_repository }}
    steps:
      - name: Check out immutable commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Write release version
        run: printf '%s\n' '${{ needs.prepare.outputs.release_id }}' > VERSION

      - name: Resolve GHCR repository
        id: repository
        run: |
          IMAGE_REPOSITORY="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image_repository=$IMAGE_REPOSITORY" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push production image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.repository.outputs.image_repository }}:${{ needs.prepare.outputs.release_id }}
            ${{ steps.repository.outputs.image_repository }}:sha-${{ needs.prepare.outputs.sha }}
          cache-from: type=gha,scope=production-amd64
          cache-to: type=gha,mode=max,scope=production-amd64
          provenance: mode=max
          sbom: true

      - name: Export immutable image reference
        id: image
        env:
          IMAGE_REPOSITORY: ${{ steps.repository.outputs.image_repository }}
          IMAGE_INDEX_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          PLATFORM_DIGEST=$(
            docker buildx imagetools inspect \
              "$IMAGE_REPOSITORY@$IMAGE_INDEX_DIGEST" \
              --format '{{json .Manifest}}' |
              jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest' |
              head -n 1
          )
          if [[ ! $PLATFORM_DIGEST =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo '::error::Unable to resolve the linux/amd64 image digest.'
            exit 1
          fi
          echo "image_ref=${IMAGE_REPOSITORY}@${PLATFORM_DIGEST}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy with health check and rollback
    needs: [prepare, validate, build_image]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
      PRODUCTION_PORT: ${{ secrets.PRODUCTION_PORT }}
      PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
      PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
      PRODUCTION_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
      DEPLOY_ROOT: ${{ vars.PRODUCTION_DEPLOY_ROOT }}
      FRONTEND_ROOT: ${{ vars.PRODUCTION_FRONTEND_ROOT }}
      HEALTH_URL: ${{ vars.PRODUCTION_HEALTH_URL }}
      RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
      SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
      IMAGE_REF: ${{ needs.build_image.outputs.image_ref }}
    steps:
      - name: Download verified frontend bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: production-frontend-${{ needs.prepare.outputs.release_id }}
          path: release-bundle

      - name: Configure verified SSH connection
        run: |
          : "${PRODUCTION_HOST:?PRODUCTION_HOST is required}"
          : "${PRODUCTION_USER:?PRODUCTION_USER is required}"
          : "${PRODUCTION_SSH_KEY:?PRODUCTION_SSH_KEY is required}"
          : "${PRODUCTION_KNOWN_HOSTS:?PRODUCTION_KNOWN_HOSTS is required}"
          PRODUCTION_PORT=${PRODUCTION_PORT:-22}
          [[ $PRODUCTION_PORT =~ ^[0-9]+$ ]] || { echo '::error::PRODUCTION_PORT must be numeric'; exit 1; }

          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$PRODUCTION_SSH_KEY" > "$HOME/.ssh/production"
          chmod 0600 "$HOME/.ssh/production"
          printf '%s\n' "$PRODUCTION_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/production" >/dev/null
          echo "PRODUCTION_PORT=$PRODUCTION_PORT" >> "$GITHUB_ENV"

      - name: Upload release bundle
        run: |
          REMOTE_HOME=$(ssh -i "$HOME/.ssh/production" -p "$PRODUCTION_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "$PRODUCTION_USER@$PRODUCTION_HOST" 'printf %s "$HOME"')
          [[ $REMOTE_HOME =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo '::error::Unexpected remote home path'; exit 1; }
          REMOTE_STAGE="$REMOTE_HOME/.new-api-releases/$RELEASE_ID"

          printf -v mkdir_command 'mkdir -p %q' "$REMOTE_STAGE"
          ssh -i "$HOME/.ssh/production" -p "$PRODUCTION_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "$PRODUCTION_USER@$PRODUCTION_HOST" "$mkdir_command"

          scp -i "$HOME/.ssh/production" -P "$PRODUCTION_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            release-bundle/frontend.tar.gz release-bundle/frontend.tar.gz.sha256 \
            "$PRODUCTION_USER@$PRODUCTION_HOST:$REMOTE_STAGE/"

          echo "REMOTE_STAGE=$REMOTE_STAGE" >> "$GITHUB_ENV"

      - name: Activate release
        run: |
          DEPLOY_ROOT=${DEPLOY_ROOT:-/opt/new-api-async-staging}
          FRONTEND_ROOT=${FRONTEND_ROOT:-/var/www/async-api-frontend}
          HEALTH_URL=${HEALTH_URL:-https://async-api.nexaapp.cn/api/status}

          remote_args=(
            sudo -n /usr/local/sbin/new-api-production-deploy
            --release-id "$RELEASE_ID"
            --image "$IMAGE_REF"
            --frontend-archive "$REMOTE_STAGE/frontend.tar.gz"
            --frontend-checksum-file "$REMOTE_STAGE/frontend.tar.gz.sha256"
            --source-sha "$SOURCE_SHA"
            --deploy-root "$DEPLOY_ROOT"
            --frontend-root "$FRONTEND_ROOT"
            --health-url "$HEALTH_URL"
          )
          printf -v remote_command '%q ' "${remote_args[@]}"
          ssh -i "$HOME/.ssh/production" -p "$PRODUCTION_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "$PRODUCTION_USER@$PRODUCTION_HOST" "$remote_command"

      - name: Write release summary
        env:
          IMAGE_REPOSITORY: ${{ needs.build_image.outputs.image_repository }}
        run: |
          {
            echo '## Production release completed'
            echo
            echo "- Release: \`$RELEASE_ID\`"
            echo "- Commit: \`$SOURCE_SHA\`"
            echo "- Image repository: \`$IMAGE_REPOSITORY\`"
            echo "- Image: \`$IMAGE_REF\`"
            echo "- Health URL: \`${HEALTH_URL:-https://async-api.nexaapp.cn/api/status}\`"
          } >> "$GITHUB_STEP_SUMMARY"
